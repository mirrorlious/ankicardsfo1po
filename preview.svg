  <text x="72" y="385" font-family="Noto Serif CJK SC, Songti SC, serif" font-size="18" fill="#645a4e">民法基本原则有哪些？其功能是什么？</text>
  <line x1="52" y1="422" x2="788" y2="422" stroke="#d6cdbd"/>
  <g font-family="Noto Serif CJK SC, Songti SC, serif" font-size="17" fill="#443d35">
    <text x="56" y="472">民法基本原则：效力贯穿于民法始终的基本准则，对民事立法、</text>
    <text x="56" y="500">民事行为和民事司法具有普遍指导意义。</text>
    <text x="56" y="556">功能（三方面）：指导功能、约束功能、补充功能。</text>
  </g>
