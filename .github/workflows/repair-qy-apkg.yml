name: Repair QY APKG

on:
  push:
    branches: [main]
    paths:
      - .tmp-apkg-ready

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and validate APKG
        shell: bash
        run: |
          set -euo pipefail
          TARGET='QY民法法硕Anki记忆卡片.apkg'
          grep -h -v '^ENDCHUNK$' .tmp-apkg-part-* > /tmp/qy-apkg.b64
          tr -d '\n\r' < /tmp/qy-apkg.b64 | base64 --decode > "$TARGET"
          python - <<'PY'
          from pathlib import Path
          import hashlib, zipfile
          p = Path('QY民法法硕Anki记忆卡片.apkg')
          expected_size = 123321
          expected_sha = '3b1825728f0543b80c9a6b81dbf81c2812d26f3948092f128f43c913cefcd8da'
          assert p.stat().st_size == expected_size, (p.stat().st_size, expected_size)
          assert hashlib.sha256(p.read_bytes()).hexdigest() == expected_sha
          with zipfile.ZipFile(p, 'r') as z:
              assert z.testzip() is None
              names = set(z.namelist())
              assert 'collection.anki2' in names
              assert 'media' in names
          PY

      - name: Commit repaired binary and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .tmp-apkg-ready .tmp-apkg-part-* .github/workflows/repair-qy-apkg.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'QY民法法硕Anki记忆卡片.apkg'
          git add -u
          git commit -m 'fix: replace corrupted QY civil law APKG'
          git push origin HEAD:main
