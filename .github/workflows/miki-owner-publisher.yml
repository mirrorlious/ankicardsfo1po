name: Miki Owner Publisher

on:
  push:
    branches:
      - main
    paths:
      - '*.apkg'
      - 'incoming/**/*.apkg'
      - 'miki-publisher.json'
      - 'scripts/publish_miki_owner_pack.py'
      - '.github/workflows/miki-owner-publisher.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: miki-owner-publisher-main
  cancel-in-progress: false

jobs:
  publish:
    name: Build immutable owner feed
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.actor == github.repository_owner

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure publisher identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build APKG manifests and template security reports
        run: |
          export MIKI_RELEASE_DATE="$(date -u +%Y%m%d)"
          python3 scripts/publish_miki_owner_pack.py build

      - name: Commit immutable manifest snapshot
        id: manifest_commit
        run: |
          git add -- '.miki-'*.manifest.v2.json '.miki-reports/' '.miki-publish-state.json'
          if git diff --cached --quiet; then
            echo "No manifest changes detected."
          else
            git commit -m "build(owner-publisher): refresh APKG release manifests"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build owner public feed against immutable manifest commit
        run: |
          python3 scripts/publish_miki_owner_pack.py feed --commit '${{ steps.manifest_commit.outputs.sha }}'

      - name: Commit mutable owner feed index
        run: |
          git add -- 'miki-public/index.json'
          if git diff --cached --quiet; then
            echo "Owner feed already points at the current immutable release."
          else
            git commit -m "build(owner-publisher): update Miki owner feed"
          fi

      - name: Push publisher commits
        run: |
          git push origin HEAD:main
